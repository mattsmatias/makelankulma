<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sivua ei löytynyt – Mäkelän Kulma</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Hanken+Grotesk:wght@500;700&display=swap">
<style>
:root{--ink:#0E0F0B;--white:#FBFBF8;--mist:#C4C6BB;--olive:#6E7B3B;--olive-hi:#A3B262;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(600px 400px at 80% 0%,rgba(110,123,59,.4),transparent 70%),var(--ink);color:var(--white);font-family:"Hanken Grotesk",system-ui,sans-serif;text-align:center}
main{display:grid;justify-items:center;gap:18px;max-width:520px}
img{height:72px;width:auto}
h1{margin:0;font:900 clamp(3.4rem,16vw,6rem)/.9 "Big Shoulders Display","Arial Narrow",sans-serif;text-transform:uppercase}
h1 span{color:var(--olive-hi)}
p{margin:0;color:var(--mist);font-size:1.05rem;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
a.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 1.5em;border-radius:999px;font-weight:700;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.p{background:var(--olive);color:#fff}.s{border:1.5px solid rgba(251,251,248,.5);color:#fff}
</style>
</head>
<body>
<main>
  <img src="/assets/logo-white.png" alt="Ravintola Mäkelän Kulma" width="119" height="80">
  <h1>Sivua ei <span>löytynyt</span></h1>
  <p>Etsimääsi sivua ei ole olemassa. Ruokalista ja tilaus löytyvät etusivulta.</p>
  <div class="row"><a class="btn p" href="/">Etusivulle</a><a class="btn s" href="/#/menu">Katso menu</a></div>
</main>
</body>
</html>
